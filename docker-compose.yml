# Local-only database for Oneal Conjugue! (Phase 1+).
# Port 5433 on purpose: another local project already uses 5432.
# Data lives in the pgdata Docker volume (never in git).
services:
  postgres:
    image: postgres:16
    container_name: oneal-conjugue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneal_conjugue
      POSTGRES_USER: oneal
      POSTGRES_PASSWORD: oneal_local
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneal -d oneal_conjugue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
